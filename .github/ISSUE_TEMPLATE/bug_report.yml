name: Bug report
description: Something in the code, tests or tooling does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command you ran and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and whether you used --mock, a real API, or the Colab notebook.
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Safety check
      options:
        - label: I removed API keys and other secrets from the output pasted above.
          required: true
